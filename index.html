<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENDLESS // ASCII CITY</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <canvas id="screen" aria-label="3D ASCII city game"></canvas>
    <section id="start" class="panel">
      <p class="eyebrow">PROCEDURAL URBAN SIMULATION</p>
      <h1>ENDLESS<span>//</span>CITY</h1>
      <p>A city generated one block at a time. Walk it. Jump it. Drive forever.</p>
      <button id="play">ENTER THE CITY</button>
      <p class="keys"><b>WASD</b> move / drive · <b>mouse</b> look · <b>V</b> first/third person · <b>space</b> jump / brake · <b>E</b> enter or exit car</p>
    </section>
    <div id="hint" class="hint"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
